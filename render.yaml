# Render Blueprint: https://render.com/docs/blueprint-spec
# Each service redeploys from main only after the GitHub CI checks pass.

databases:
  - name: steam-analytics-db
    databaseName: steam_analytics
    plan: free

services:
  # Express API. Applies pending database/migrations on startup.
  - type: web
    name: steam-api
    runtime: docker
    plan: free
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - services/api/**
        - database/migrations/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: steam-analytics-db
          property: connectionString

  # Polls Steam every 10 minutes. Background workers need a paid plan.
  - type: worker
    name: steam-ingestion
    runtime: docker
    plan: starter
    rootDir: services/ingestion
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: steam-analytics-db
          property: connectionString
      - key: TOP_GAMES_LIMIT
        value: "25"

  # React dashboard, built by Vite and served as static files.
  - type: web
    name: steam-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The API's public URL plus /api, e.g. https://steam-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
